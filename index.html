const $ = id => document.getElementById(id);
let deck = [], pos = 0, revealed = false; const MIDTERM_GROUPS=new Set([1,2,3,4,5,6,11,12,13,14,15,16]); function groupOf(x){return Math.ceil(x.id/17)} function scopedItems(scope){if(scope==='midterm')return ITEMS.filter(x=>MIDTERM_GROUPS.has(groupOf(x)));if(scope==='final')return ITEMS.filter(x=>!MIDTERM_GROUPS.has(groupOf(x)));return ITEMS} function configureScope(){const list=$('viewMode').value==='list';$('scope').innerHTML=list?'<option value="all">全部藥材</option><option value="midterm">期中考（204 味）</option><option value="final">期末考（136 味）</option>':'<option value="all">全部藥材（340 味）</option><option value="midterm">期中考（204 味）</option><option value="final">期末考（136 味）</option><option value="due">只練待複習</option>';$('shuffle').classList.toggle('hidden',list);$('reset').classList.toggle('hidden',list);$('pageTitle').textContent=list?'藥材列表':'看圖猜藥名';$('pageSub').textContent=list?'瀏覽標本照片、藥名與編號。':'先看標本照片猜答案，再翻牌核對。答對得分，答不出來就放進複習清單。';$('listView').classList.toggle('hidden',!list);['progress','score'].forEach(id=>$(id).parentElement.classList.toggle('hidden',list));$('fill').parentElement.classList.toggle('hidden',list);$('specimen').parentElement.parentElement.classList.toggle('hidden',list);$('answer').classList.toggle('hidden',list);$('hint').classList.toggle('hidden',list);document.querySelectorAll('.actions').forEach(el=>el.classList.toggle('hidden',list));if(list)renderList();else makeDeck()} function renderList(){const entries=scopedItems($('scope').value);$('listCount').textContent=`顯示 ${entries.length} 味藥材`;$('listGrid').replaceChildren();for(const x of entries){const c=document.createElement('article');c.className='list-card';const cv=document.createElement('canvas');cv.width=480;cv.height=360;const h=document.createElement('h3');h.textContent=x.name;const m=document.createElement('p');m.textContent=`標本編號 ${String(x.id).padStart(3,'0')} · 第 ${groupOf(x)} 組`;c.append(cv,h,m);$('listGrid').append(c);const img=new Image();img.onload=()=>cv.getContext('2d').drawImage(img,(x.slot%4)*480,Math.floor(x.slot/4)*360,480,360,0,0,480,360);img.src='圖集/'+x.sheet}}
function readSet(key){try{return new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{return new Set()}}
let known = readSet('herb-known'), revisit = readSet('herb-review');
function save(){try{localStorage.setItem('herb-known',JSON.stringify([...known]));localStorage.setItem('herb-review',JSON.stringify([...revisit]))}catch{}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeDeck(){const scope=$('scope').value;deck=shuffle((scope==='due'?ITEMS.filter(x=>revisit.has(x.id)):scopedItems(scope)).slice());pos=0;revealed=false;render()}
function showSpecimen(x){const canvas=$('specimen');const ctx=canvas.getContext('2d');const img=new Image();img.onload=()=>{canvas.width=480;canvas.height=360;const col=x.slot%4,row=Math.floor(x.slot/4);ctx.drawImage(img,col*480,row*360,480,360,0,0,480,360)};img.onerror=()=>{canvas.style.display='none';$('fallback').style.display='block'};img.src='圖集/'+x.sheet}function render(){if(!deck.length){$('specimen').style.display='none';$('fallback').style.display='block';$('fallback').textContent='目前沒有待複習藥材。先在「全部藥材」中作答並加入待複習。';$('answer').classList.add('show');$('name').textContent='複習清單是空的';$('number').textContent='';$('progress').textContent='—';$('fill').style.width='0%';$('reveal').classList.add('hidden');$('correct').classList.add('hidden');$('again').classList.add('hidden');$('next').classList.add('hidden');return}
const x=deck[pos];$('specimen').style.display='block';$('fallback').style.display='none';$('fallbackFile').textContent=x.file;showSpecimen(x);$('name').textContent=x.name;$('number').textContent='標本編號 '+String(x.id).padStart(3,'0');$('progress').textContent=`第 ${pos+1} / ${deck.length} 張`;$('fill').style.width=`${((pos+1)/deck.length)*100}%`;$('score').textContent=`答對 ${known.size} 味 · 待複習 ${revisit.size} 味`;$('answer').classList.toggle('show',revealed);$('hint').textContent=revealed?'認完後標記答題結果，或繼續下一味':'心中想好答案後，按「翻開藥名」';$('reveal').classList.toggle('hidden',revealed);$('correct').classList.toggle('hidden',!revealed);$('again').classList.toggle('hidden',!revealed);$('next').classList.toggle('hidden',!revealed)}
function advance(){if(!deck.length)return;pos=(pos+1)%deck.length;revealed=false;render()}
$('reveal').onclick=()=>{revealed=true;render()};$('correct').onclick=()=>{const id=deck[pos].id;known.add(id);revisit.delete(id);save();advance()};$('again').onclick=()=>{const id=deck[pos].id;revisit.add(id);known.delete(id);save();advance()};$('next').onclick=advance;$('skip').onclick=advance;$('prev').onclick=()=>{if(deck.length){pos=(pos-1+deck.length)%deck.length;revealed=false;render()}};$('shuffle').onclick=makeDeck;$('scope').onchange=()=>{$('viewMode').value==='list'?renderList():makeDeck()};$('viewMode').onchange=configureScope;$('reset').onclick=()=>{known.clear();revisit.clear();save();makeDeck()};$('totalTag').textContent=`共 ${ITEMS.length} 味藥材`;configureScope();
</script></body></html>
